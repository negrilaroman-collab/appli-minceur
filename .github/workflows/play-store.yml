# Construit l'AAB signé pour Google Play et l'envoie sur la piste "test interne".
# Ne fait rien tant que les secrets ne sont pas configurés (voir store/GUIDE-PLAY-STORE.md).
#
# Secrets GitHub nécessaires (Settings > Secrets and variables > Actions) :
#   ANDROID_KEYSTORE_BASE64   la clé d'envoi (.jks) encodée en base64
#   ANDROID_KEYSTORE_PASSWORD mot de passe du fichier .jks
#   ANDROID_KEY_ALIAS         alias de la clé (ex. upload)
#   ANDROID_KEY_PASSWORD      mot de passe de la clé (souvent le même)
#   PLAY_SERVICE_ACCOUNT_JSON (optionnel) compte de service Google Play pour l'envoi auto
# Variable GitHub (onglet Variables) :
#   PLAY_RELEASE_STATUS       "draft" tant que l'appli n'a jamais été publiée, puis "completed"
name: Google Play

on:
  push:
    branches: [main, photo-kcal]
  workflow_dispatch:
    inputs:
      piste:
        description: "Piste Google Play (internal, alpha = test fermé, beta, production)"
        default: internal
        required: true

permissions:
  contents: read

concurrency:
  group: play-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Secrets présents ?
        id: secrets
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::Pas de clé d'envoi (ANDROID_KEYSTORE_BASE64) : AAB non construit. Voir store/GUIDE-PLAY-STORE.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$PLAY_JSON" ]; then echo "envoi=true" >> "$GITHUB_OUTPUT"; else echo "envoi=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-aab-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: gradle-

      - name: Installer les dépendances
        if: steps.secrets.outputs.ok == 'true'
        run: npm ci

      - name: Tests et types
        if: steps.secrets.outputs.ok == 'true'
        run: |
          npm test
          npx tsc --noEmit

      - name: Récupérer la clé d'envoi
        if: steps.secrets.outputs.ok == 'true'
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Générer le projet Android
        if: steps.secrets.outputs.ok == 'true'
        env:
          # Google Play exige un numéro qui augmente à chaque envoi.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: npx expo prebuild --platform android --no-install

      - name: Construire l'AAB signé
        if: steps.secrets.outputs.ok == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renommer l'AAB
        if: steps.secrets.outputs.ok == 'true'
        run: cp android/app/build/outputs/bundle/release/app-release.aab "appli-minceur-${{ github.run_number }}.aab"

      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          name: appli-minceur-aab
          path: appli-minceur-*.aab
          retention-days: 30

      - name: Envoyer sur Google Play
        if: steps.secrets.outputs.ok == 'true' && steps.secrets.outputs.envoi == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.appliminceur.app
          releaseFiles: appli-minceur-*.aab
          track: ${{ inputs.piste || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
